name: Build Unsigned IPA (Jailbroken)

# 越狱设备专用：云端 macOS 自动编译「无签名 IPA」，无需 Apple 账号 / 证书。
# 触发：push 到 main，或在 Actions 页手动 Run workflow。
# 产物：Artifacts 里的 CreditCardManager-IPA（下载后装到越狱设备）。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          chmod +x build-jailed.sh
          ./build-jailed.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreditCardManager-IPA
          path: CreditCardManager.ipa
