name: Build Unsigned IPA (Jailbroken)

# 越狱设备专用：云端 macOS 自动编译「无签名 IPA」，无需 Apple 账号 / 证书。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Homebrew 4.4+ tap trust 校验会让 brew install xcodegen 失败，关掉。
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          set -x
          sw_vers || true
          xcode-select -p || true
          xcodebuild -version || true
          swift --version || true
          xcrun --show-sdk-path --sdk iphoneos || true
          which brew && brew --version || true

      - name: Clean legacy taps
        # 移除 Homebrew 4.x 视为未受信任的遗留 tap。
        run: |
          set -x
          for t in aws/tap azure/functions homebrew/cask-versions; do
            if brew tap | grep -q "^${t}$"; then
              echo "Untapping $t ..."
              brew untap "$t" || true
            fi
          done
          echo "--- remaining taps ---"
          brew tap || true

      - name: Ensure XcodeGen
        run: |
          set -x
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
            xcodegen --version
          fi

      - name: Generate Xcode project
        run: |
          set -x
          xcodegen generate
          ls -la CreditCardManager.xcodeproj || true

      - name: Build unsigned IPA
        run: |
          set -x
          chmod +x build-jailed.sh
          ./build-jailed.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreditCardManager-IPA
          path: CreditCardManager.ipa
          if-no-files-found: error
